<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ScamLens · Full report</title>
  <link rel="icon" href="../assets/icon-48.png">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="results.css">
</head>
<body>
<div class="page">
  <header class="topbar">
    <a class="brand" href="#" aria-label="ScamLens"><span data-icon="shield-check" data-size="22"></span>ScamLens</a>
    <nav class="nav">
      <a class="settings-link" href="options.html">Privacy &amp; settings <span data-icon="sliders" data-size="15"></span></a>
    </nav>
  </header>

  <!-- Loading skeleton mirrors the report layout -->
  <main id="loading" class="skel" aria-busy="true" aria-live="polite">
    <p class="sr-only" style="position:absolute;left:-9999px">Analyzing, please wait…</p>
    <div class="card hero-skel">
      <span class="sk" style="width:96px;height:96px;border-radius:50%"></span>
      <div style="flex:1;display:grid;gap:10px">
        <span class="sk" style="width:90px;height:18px;border-radius:99px"></span>
        <span class="sk" style="width:min(340px,80%);height:24px"></span>
        <span class="sk" style="width:90%;height:11px"></span>
      </div>
    </div>
    <div class="columns">
      <div class="stack">
        <div class="card"><span class="sk" style="width:170px;height:12px"></span><span class="sk" style="width:85%;height:10px"></span><span class="sk" style="width:70%;height:10px"></span></div>
        <div class="card"><span class="sk" style="width:150px;height:12px"></span><span class="sk" style="width:80%;height:10px"></span></div>
      </div>
      <div class="side">
        <div class="card"><span class="sk" style="width:60%;height:12px"></span><span class="sk" style="width:80%;height:11px"></span><span class="sk" style="width:70%;height:11px"></span></div>
        <span class="sk" style="width:100%;height:40px;border-radius:10px"></span>
      </div>
    </div>
  </main>

  <!-- Error / empty -->
  <main id="state" class="state" hidden>
    <span class="glyph" id="state-icon"></span>
    <h2 id="state-title"></h2>
    <p id="state-text"></p>
    <div class="row">
      <button id="sign-in" class="btn primary" hidden><span data-icon="log-in" data-size="14"></span>Continue with Google</button>
      <button id="retry" class="btn primary" hidden><span data-icon="refresh-cw" data-size="14"></span>Try again</button>
      <button id="use-local" class="btn" hidden>Run basic on-device check</button>
    </div>
  </main>

  <!-- Report -->
  <main id="report" hidden>
    <div class="meta"><span id="eyebrow"></span><time id="date"></time></div>

    <section id="hero" class="hero card" aria-labelledby="notice-title">
      <div id="gauge" class="gauge" role="img"></div>
      <div class="hero-body">
        <span id="badge-slot"></span>
        <h2 id="notice-title"></h2>
        <p id="notice-text"></p>
        <div id="chips" class="chips"></div>
      </div>
    </section>

    <section class="subject">
      <p class="label">Checked</p>
      <h1 id="title"></h1>
      <div id="url-wrap" class="url-wrap" hidden>
        <p id="url" class="url mono clamp"></p>
        <button id="url-toggle" class="link-btn" type="button" hidden>Show full address</button>
      </div>
    </section>

    <div class="columns">
      <section>
        <h2 class="section-title">Why we're flagging this</h2>
        <p class="hint" id="hint"></p>
        <div id="findings" class="stack"></div>
        <div id="url-card" class="card" style="margin-top:12px" hidden>
          <p class="label">URL structure · factual observations</p>
          <div id="url-line" class="url-line"></div>
          <div id="url-notes" class="url-notes"></div>
        </div>
      </section>

      <aside class="side">
        <h2 class="section-title">Before you act</h2>
        <div class="card actions"><h3>What should you do?</h3><ol id="actions"></ol></div>
        <div id="domain-card" class="card domain" hidden></div>
        <div id="scores-card" class="card scores" hidden>
          <p class="label">Score breakdown</p>
          <div id="scores"></div>
        </div>
        <p class="fine"><span data-icon="info" data-size="13"></span><span id="disclaimer"></span></p>
      </aside>
    </div>
  </main>
</div>

<script type="module" src="results.js"></script>
</body>
</html>
